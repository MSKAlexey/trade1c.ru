name: CFE build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  extract-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install v8unpack
        run: python -m pip install --disable-pip-version-check v8unpack==1.2.6
      - name: Download template CFE
        run: |
          python - <<'PY'
          import urllib.request
          url = 'https://raw.githubusercontent.com/emakei/cfe/main/%D0%98%D0%B7%D0%BC%D0%B5%D0%BD%D0%B5%D0%BD%D0%B8%D0%B5%D0%90%D0%BB%D0%B3%D0%BE%D1%80%D0%B8%D1%82%D0%BC%D0%BE%D0%B2%D0%97%D0%B0%D0%B3%D1%80%D1%83%D0%B7%D0%BA%D0%B8%D0%94%D0%B0%D0%BD%D0%BD%D1%8B%D1%85.cfe'
          urllib.request.urlretrieve(url, 'template.cfe')
          PY
      - name: Extract template
        run: |
          mkdir -p extracted
          v8unpack -E template.cfe extracted --processes 1
          find extracted -type f -maxdepth 10 -print
      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: extracted-cfe-source
          path: extracted
          include-hidden-files: true
