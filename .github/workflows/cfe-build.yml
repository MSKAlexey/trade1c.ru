name: Build 1C extension for ETM UПD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install v8unpack
        run: python -m pip install --disable-pip-version-check v8unpack==1.2.6

      - name: Build and verify CFE
        run: |
          sed -i 's/f5d3d06c-49a2-4a75-ae1c-9fb23800c5e2/cfe20df0-7c8e-4247-b8db-9cffffd0a18f/g' .github/scripts/build_target_cfe.py
          python .github/scripts/build_target_cfe.py

      - name: Upload CFE
        uses: actions/upload-artifact@v4
        with:
          name: АНЬДЭЛИ_ЭЛЕКТРИК_РУС_УПД_ЭТМ
          path: |
            АНЬДЭЛИ_ЭЛЕКТРИК_РУС_УПД_ЭТМ.cfe
            SHA256.txt
          if-no-files-found: error
