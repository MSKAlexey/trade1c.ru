name: CFE build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  extract-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install v8unpack
        run: python -m pip install --disable-pip-version-check v8unpack==1.2.6
      - name: Download template CFE
        run: |
          python - <<'PY'
          import urllib.request
          url = 'https://github.com/pulh1/QueryConsole1C/releases/download/beta/QueryConsoleZUP-0.5.0.1.cfe'
          urllib.request.urlretrieve(url, 'template.cfe')
          PY
      - name: Extract template
        run: |
          mkdir -p extracted
          v8unpack -E template.cfe extracted --processes 1
          find extracted -type f -maxdepth 10 -print
      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: extracted-common-module-cfe-source
          path: extracted
          include-hidden-files: true
